# AIMUZA — Docker Compose (Production)
# Образы тянутся с Docker Hub (romzett/aimuza-*)
# Системный Nginx + Let's Encrypt (уже на сервере)
# Все контейнеры слушают 127.0.0.1

services:
  storage-permissions:
    logging:
      driver: journald
    image: romzett/aimuza-api:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1000:1000 /media/uploads /media/ffmpeg-tmp /media/ffmpeg-output"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    volumes:
      - uploads_data:/media/uploads
      - ffmpeg_tmp:/media/ffmpeg-tmp
      - ffmpeg_output:/media/ffmpeg-output
    networks: [aimuza-net]

  # ── PostgreSQL ──────────────────────────────
  db:
    logging:
      driver: journald
    image: postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
    container_name: aimuza-db
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${DB_NAME:-aimuza}
      POSTGRES_USER: ${DB_USER:-aimuza}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - aimuza-net

  # ── API Server (Node.js) ───────────────────
  api:
    logging:
      driver: journald
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    image: romzett/aimuza-api:latest
    container_name: aimuza-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aimuza}
      DB_USER: ${DB_USER:-aimuza}
      DB_PASSWORD: ${DB_PASSWORD}
      API_PORT: 3000
      UPLOADS_DIR: /opt/aimuza/data/uploads
      DENO_FUNCTIONS_URL: http://deno-functions:8081
      FFMPEG_OUTPUT_DIR: /opt/aimuza/data/ffmpeg-output
    volumes:
      - uploads_data:/opt/aimuza/data/uploads
      - ffmpeg_output:/opt/aimuza/data/ffmpeg-output
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aimuza-net

  # ── Deno Functions ─────────────────────────
  deno-functions:
    logging:
      driver: journald
    mem_limit: 1024m
    cpus: 2
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    image: romzett/aimuza-deno:latest
    container_name: aimuza-deno
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ffmpeg-api:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DENO_PORT: 8081
      SUPABASE_URL: http://api:3000
      SUPABASE_ANON_KEY: ${ANON_KEY:-placeholder}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      VPS_FFMPEG_URL: http://ffmpeg-api:3001
      FFMPEG_API_URL: http://ffmpeg-api:3001
      FFMPEG_PUBLIC_URL: ${BASE_URL:-https://aimuza.ru}/api/ffmpeg
      FFMPEG_API_SECRET: ${FFMPEG_API_KEY:-}
      AUDIO_MASTER_CONCURRENCY: ${AUDIO_MASTER_CONCURRENCY:-4}
      AUDIO_MASTER_MAX_ATTEMPTS: ${AUDIO_MASTER_MAX_ATTEMPTS:-8}
      AUDIO_MASTER_LEASE_SECONDS: ${AUDIO_MASTER_LEASE_SECONDS:-600}
      BASE_URL: ${BASE_URL:-https://aimuza.ru}
      GOTENBERG_URL: http://gotenberg:3000
      ROBOKASSA_MERCHANT_LOGIN: ${ROBOKASSA_MERCHANT_LOGIN:-}
      ROBOKASSA_PASSWORD1: ${ROBOKASSA_PASSWORD1:-}
      ROBOKASSA_PASSWORD2: ${ROBOKASSA_PASSWORD2:-}
      ROBOKASSA_TEST_MODE: ${ROBOKASSA_TEST_MODE:-false}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "/usr/bin/deno", "eval", "--cached-only", "if (!(await fetch('http://localhost:8081/')).ok) Deno.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - aimuza-net

  # ── PDF Service (Gotenberg) ─────────────────
  gotenberg:
    logging:
      driver: journald
    mem_limit: 1024m
    cpus: 1
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    image: gotenberg/gotenberg:8-chromium@sha256:558943677cf9092df83ff654c2645856dcb9ddf777f359243789688e74f3bcdd
    container_name: aimuza-gotenberg
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-deny-private-ips=true
      - --api-download-from-max-entries=0
      - --api-download-from-deny-private-ips=true
    ports:
      - "127.0.0.1:3010:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - aimuza-net

  # ── FFmpeg API ─────────────────────────────
  ffmpeg-api:
    logging:
      driver: journald
    mem_limit: 1024m
    cpus: 2
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    image: romzett/aimuza-ffmpeg:latest
    container_name: aimuza-ffmpeg
    restart: unless-stopped
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      FFMPEG_API_KEY: ${FFMPEG_API_KEY:-}
      MEDIA_ALLOWED_ORIGINS: ${MEDIA_ALLOWED_ORIGINS:-}
      BASE_URL: ${BASE_URL:-https://aimuza.ru}
      FFMPEG_MAX_CONCURRENT_JOBS: ${FFMPEG_MAX_CONCURRENT_JOBS:-4}
      FFMPEG_MAX_QUEUED_JOBS: ${FFMPEG_MAX_QUEUED_JOBS:-512}
    volumes:
      - ffmpeg_tmp:/app/uploads
      - ffmpeg_output:/app/output
    ports:
      - "127.0.0.1:3100:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aimuza-net

  # ── Realtime WebSocket ────────────────────
  realtime:
    logging:
      driver: journald
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    image: romzett/aimuza-realtime:latest
    container_name: aimuza-realtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aimuza}
      DB_USER: ${DB_USER:-aimuza}
      DB_PASSWORD: ${DB_PASSWORD}
      WS_PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net');const c=net.connect(4000,()=>{c.end();process.exit(0)});c.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aimuza-net

  # ── Radio Service (Queue Worker) ────────────
  radio:
    logging:
      driver: journald
    mem_limit: 1024m
    cpus: 1
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    image: romzett/aimuza-radio:latest
    container_name: aimuza-radio
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aimuza}
      DB_USER: ${DB_USER:-aimuza}
      DB_PASSWORD: ${DB_PASSWORD}
      ICECAST_SOURCE_PASS: ${ICECAST_SOURCE_PASS:?ICECAST_SOURCE_PASS must be set}
      ICECAST_ADMIN_PASS: ${ICECAST_ADMIN_PASS:?ICECAST_ADMIN_PASS must be set}
      QUEUE_INTERVAL_MS: ${QUEUE_INTERVAL_MS:-30000}
      PREDICTION_RESOLVE_INTERVAL_MS: ${PREDICTION_RESOLVE_INTERVAL_MS:-60000}
      BOOST_CHECK_INTERVAL_MS: ${BOOST_CHECK_INTERVAL_MS:-15000}
      PORT: 3200
      STORAGE_BASE_URL: https://aimuza.ru/storage/v1/object/public
      LOCAL_STORAGE_PATH: /opt/aimuza/data/uploads
      PUBLIC_BASE_URL: https://aimuza.ru
      JWT_SECRET: ${JWT_SECRET:-}
      RADIO_SKIP_SECRET: ${RADIO_SKIP_SECRET:-}
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads_data:/opt/aimuza/data/uploads:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3200/health').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - aimuza-net

  # ── Frontend (React SPA) ───────────────────
  # Образ environment-agnostic: URL = window.location.origin
  # ANON_KEY и SENTRY_DSN инжектятся при старте через entrypoint
  frontend:
    logging:
      driver: journald
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    image: romzett/aimuza-frontend:latest
    container_name: aimuza-frontend
    restart: unless-stopped
    environment:
      ANON_KEY: ${ANON_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - aimuza-net

  # ── AIMUZA Studio (Next.js) ────────────────
  studio:
    logging:
      driver: journald
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    image: romzett/aimuza-studio:latest
    container_name: aimuza-studio
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      AIMUZA_API_URL: http://api:3000
      AIMUZA_ANON_KEY: ${ANON_KEY}
      AIMUZA_SITE_URL: ${AIMUZA_SITE_URL:-https://aimuza.ru}
    ports:
      - "127.0.0.1:3101:3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/api/config"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - aimuza-net

volumes:
  pg_data:
  uploads_data:
  ffmpeg_tmp:
  ffmpeg_output:

networks:
  aimuza-net:
    driver: bridge
