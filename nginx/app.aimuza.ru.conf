log_format aimuza_studio_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
# System nginx vhost for the independent Studio container.
server {
    access_log /var/log/nginx/access.log aimuza_studio_safe;
    listen 80;
    server_name app.aimuza.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    access_log /var/log/nginx/access.log aimuza_studio_safe;
    # HTTP/2 ЗДЕСЬ ВКЛЮЧАТЬ НЕЛЬЗЯ, даже только для этого vhost: параметр http2
    # в listen действует на весь сокет :443 целиком — основной сайт aimuza.ru
    # тоже переезжает на h2, где 24.08.2026 ловили ERR_HTTP2_PROTOCOL_ERROR
    # и массовые 499 (см. комментарий в aimuza.ru.prod.conf). Включать только
    # после устранения той первопричины и на отдельном listen-сокете/IP.
    listen 443 ssl;
    server_name app.aimuza.ru;

    ssl_certificate /etc/letsencrypt/live/app.aimuza.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.aimuza.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    client_max_body_size 25m;

    # ── Gzip ─────────────────────────────────────
    # Без этого блока vhost наследует Ubuntu-дефолт (gzip только text/html):
    # JS/CSS чанки уходили несжатыми (~1 МБ first load в WebView APK).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/wasm font/woff2 image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
