log_format aimuza_studio_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
# System nginx vhost for the independent Studio container.
server {
    access_log /var/log/nginx/access.log aimuza_studio_safe;
    listen 80;
    server_name app.aimuza.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    access_log /var/log/nginx/access.log aimuza_studio_safe;
    listen 443 ssl;
    server_name app.aimuza.ru;

    ssl_certificate /etc/letsencrypt/live/app.aimuza.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.aimuza.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
