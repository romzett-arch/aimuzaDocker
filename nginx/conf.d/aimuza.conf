# AIMUZA — Nginx reverse proxy
# Все запросы проксируются внутрь Docker-сети

map $http_user_agent $is_bot {
    default 0;
    ~*(Googlebot|Google-InspectionTool|GoogleOther|AdsBot-Google|Bingbot|YandexBot|YandexImages|DuckDuckBot|Slurp|TelegramBot|facebookexternalhit|Twitterbot|vk\.com|LinkedInBot|WhatsApp|Slackbot|Discordbot) 1;
}

# HTTP → HTTPS (для production)
# server {
#     listen 80;
#     server_name aimuza.ru www.aimuza.ru;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://auth.robokassa.ru https://auth.robokassa.kz; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss://aimuza.ru ws://localhost https://*.sentry.io https://cdn1.suno.ai https://cdn2.suno.ai https://cdn1.sunoapi.org https://cdn.erweima.ai https://audiopipe.suno.ai https://auth.robokassa.ru https://auth.robokassa.kz; media-src 'self' https: blob:; frame-src 'self' https://auth.robokassa.ru https://auth.robokassa.kz https://qr.nspk.ru https://music.yandex.ru; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://auth.robokassa.ru https://auth.robokassa.kz https://qr.nspk.ru;" always;
    server_name aimuza.ru www.aimuza.ru localhost;

    # SSL (раскомментировать после получения сертификатов)
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/aimuza.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/aimuza.ru/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # Max upload size
    client_max_body_size 100M;
    client_body_timeout 120s;

    # Radio Engine — stream + API + WebSocket
    location /radio/stream.mp3 {
        proxy_pass http://radio:8000/radio.mp3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        tcp_nodelay on;
        gzip off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, no-store" always;
    }
    location /radio/stream.opus {
        proxy_pass http://radio:8000/radio.opus;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        tcp_nodelay on;
        gzip off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, no-store" always;
    }
    location /radio/status {
        proxy_pass http://radio:8000/status-json.xsl;
    }
    location ^~ /radio/api/internal/ { return 403; }
    location = /radio/api/skip { return 403; }
    location /radio/api/ {
        proxy_pass http://radio:3200/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location /radio/ws {
        proxy_pass http://radio:3200/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # SEO: sitemap.xml, robots.txt (Edge Functions)
    location = /sitemap.xml {
        proxy_pass http://api:3000/functions/v1/sitemap-generator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "application/xml; charset=utf-8";
    }
    location ~ ^/sitemap-([a-z]+)\.xml$ {
        set $sitemap_type $1;
        proxy_pass http://api:3000/functions/v1/sitemap-generator?type=$sitemap_type;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "application/xml; charset=utf-8";
    }
    location = /robots.txt {
        proxy_pass http://frontend:80/robots.txt;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # Frontend (React SPA) + bot-aware SEO fallback
    location / {
        if ($is_bot) {
            rewrite ^ /internal-og?url=$request_uri last;
        }
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /internal-og {
        internal;
        proxy_pass http://api:3000/functions/v1/og-renderer?url=$arg_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Server (PostgREST-compatible)
    # Используем /auth/v1/ чтобы не конфликтовать с фронтенд-роутом /auth
    location /auth/v1/ {
        proxy_pass http://api:3000/auth/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /rest/ {
        proxy_pass http://api:3000/rest/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /storage/ {
        proxy_request_buffering off;
        proxy_pass http://api:3000/storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 100M;
    }

    # Edge Functions (через API → Deno)
    # Provider callback URLs contain a capability; Nginx error logs include raw query strings.
    # Application logs retain redacted diagnostics for these two receivers.
    location = /functions/v1/suno-callback {
        error_log /dev/null;
        proxy_pass http://api:3000/functions/v1/suno-callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        client_max_body_size 256k;
    }

    # Provider callback URLs contain a capability; Nginx error logs include raw query strings.
    # Application logs retain redacted diagnostics for these two receivers.
    location = /functions/v1/wav-callback {
        error_log /dev/null;
        proxy_pass http://api:3000/functions/v1/wav-callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        client_max_body_size 256k;
    }

    location /functions/ {
        proxy_pass http://api:3000/functions/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    # FFmpeg API
    location /api/ffmpeg/ {
        proxy_pass http://ffmpeg-api:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Uploads (статические файлы)
    location /uploads/ {
        rewrite ^/uploads/(.*)$ /storage/v1/object/public/$1 break;
        proxy_pass http://api:3000;
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Realtime WebSocket (Phoenix channels)
    # resolver нужен чтобы nginx переразрешал IP контейнера после рестартов
    location /realtime/v1/websocket {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $realtime_ws http://realtime:4000;
        proxy_pass $realtime_ws/websocket$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /realtime/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $realtime_http http://realtime:4000;
        rewrite ^/realtime/(.*) /$1 break;
        proxy_pass $realtime_http;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Health
    location /health {
        proxy_pass http://api:3000/health;
    }
}
